<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>मेरा Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .card {
            background: white;
            width: 320px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        h1 {
            color: #333;
        }

        p {
            color: #555;
        }

        button {
            background: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="https://via.placeholder.com/120" alt="Profile Photo">

    <h1>आपका नाम</h1>

    <p>Web Developer</p>

    <p>मैं HTML, CSS और JavaScript सीख रहा हूँ।</p>

    <button onclick="alert('धन्यवाद!')">
        Contact Me
    </button>
</div>

</body>
</html>
